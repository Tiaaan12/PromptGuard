[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptguard"
version = "0.0.1"
description = "PromptGuard prompt injection detection component"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Christian Devera", email = "christiandevera232@gmail.com" }]
dependencies = [
    "streamlit==1.64.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pandas==3.0.6",
]

[project.optional-dependencies]
devel = [
  "wheel",
  "pytest==7.4.0",
  "playwright==1.48.0",
  "requests==2.31.0",
  "pytest-playwright-snapshot==1.0",
  "pytest-rerunfailures==12.0",
]

[tool.setuptools.packages.find]
include = ["promptguard*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
promptguard = [
    "frontend/build/*.js",
    "frontend/build/*.css",
    "pyproject.toml",
]
